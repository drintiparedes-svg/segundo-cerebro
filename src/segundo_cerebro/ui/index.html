<title>Segundo Cerebro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

    --accent: #e0b458;
    --accent-ink: #14100a;
    --person: #e0b458;
    --project: #4fc8b4;
    --organization: #8e7cd8;
    --concept: #d0708f;
    --edge: #2c3550;
    --glow: #e0b45833;
    --decision: #e46a6a;
    --chart-agenda: #8e7cd8;
    --chart-tasks: #2fa892;

      --bg: #f2f4f7;
      --bg-veil: #f2f4f7cc;
      --surface: #ffffff;
      --surface-2: #e9edf3;
      --line: #d7dde8;
      --ink: #1a2233;
      --ink-dim: #4d5a72;
      --ink-faint: #8b96ab;
      --accent: #a97c1d;
      --accent-ink: #fffaf0;
      --person: #a97c1d;
      --project: #157f6d;
      --organization: #5b4aa8;
      --concept: #a83c62;
      --edge: #c4cddc;
      --glow: #a97c1d22;
      --decision: #c2434f;
      --chart-agenda: #5b4aa8;
      --chart-tasks: #0e8b74;
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f4f7;
    --bg-veil: #f2f4f7cc;
    --surface: #ffffff;
    --surface-2: #e9edf3;
    --line: #d7dde8;
    --ink: #1a2233;
    --ink-dim: #4d5a72;
    --ink-faint: #8b96ab;
    --accent: #a97c1d;
    --accent-ink: #fffaf0;
    --person: #a97c1d;
    --project: #157f6d;
    --organization: #5b4aa8;
    --concept: #a83c62;
    --edge: #c4cddc;
    --glow: #a97c1d22;

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);

    overflow: hidden;
  }

  /* ── barra superior ────────────────────────────────────────────────── */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    display: flex; align-items: center; gap: 1.25rem;
    padding: .8rem 1.4rem;
    background: var(--bg-veil);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.25rem; font-weight: 600; letter-spacing: .01em;
    white-space: nowrap;
  }
  .wordmark em { font-style: normal; color: var(--accent); }
  .tagline {
    font-family: "JetBrains Mono", monospace;
    font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); white-space: nowrap;
  }
  #search {
    flex: 1; max-width: 30rem; margin-left: auto;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: .5rem 1.1rem; font: inherit; font-size: .88rem;
    outline: none; transition: border-color .18s;
  }
  #search:focus { border-color: var(--accent); }
  .ai-switch {
    background: transparent; color: var(--decision); border: 1.5px solid var(--decision);
    border-radius: 999px; padding: .35rem .8rem; font: inherit; font-size: .78rem;
    font-weight: 600; cursor: pointer; white-space: nowrap; letter-spacing: .02em;
  }
  .ai-switch:hover { background: var(--decision); color: var(--bg); }
  .ai-switch:focus-visible { outline: 2px solid var(--decision); outline-offset: 2px; }
  .ai-switch.off { background: var(--decision); color: var(--bg); }
  .ai-banner {
    position: fixed; top: 3.6rem; left: 0; right: 0; z-index: 29;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .5rem 1.4rem; background: var(--decision); color: var(--bg);
    font-family: "JetBrains Mono", monospace; font-size: .72rem; letter-spacing: .08em;
    text-transform: uppercase;
  }
  .ai-banner[hidden], .demo-note[hidden] { display: none; }
  body.ai-off aside { top: calc(3.6rem + 2.2rem); }   /* el banner no tapa las pestañas */
  .ai-banner button {
    background: var(--bg); color: var(--decision); border: 0; border-radius: 999px;
    padding: .2rem .7rem; font: inherit; font-size: .7rem; font-weight: 600; cursor: pointer;
  }
  #search::placeholder { color: var(--ink-faint); }

  /* ── grafo ─────────────────────────────────────────────────────────── */
  #graph { position: fixed; inset: 0; cursor: grab; }
  #graph.dragging { cursor: grabbing; }

  .legend {
    position: fixed; left: 1.4rem; bottom: 1.2rem; z-index: 20;
    display: flex; flex-direction: column; gap: .35rem;
    font-size: .78rem; color: var(--ink-dim);
  }
  .legend span { display: flex; align-items: center; gap: .5rem; }
  .legend i {
    width: .62rem; height: .62rem; border-radius: 50%; display: inline-block;
  }

  /* ── panel derecho ─────────────────────────────────────────────────── */
  aside {
    position: fixed; top: 3.6rem; right: 0; bottom: 0; z-index: 25;
    width: min(26rem, 92vw);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  aside.open { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    aside { transition: none; }
  }

  nav {
    display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line);
  }
  nav button {
    flex: 1 0 auto; padding: .7rem .3rem;
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-dim); font: inherit; font-size: .74rem; cursor: pointer;
  }
  nav button:hover { color: var(--ink); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  nav button.active { color: var(--ink); border-bottom-color: var(--accent); }

  #panel-body { flex: 1; overflow-y: auto; padding: 1.1rem 1.3rem; }

  .ko {
    padding: .75rem 0; border-bottom: 1px solid var(--line);

  .ko .meta {

    font-variant-numeric: tabular-nums;

  .chip {
    padding: .05rem .5rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: .08em; font-size: .62rem;

  .chip.decision { color: var(--person); border-color: var(--person); }
  .chip.task { color: var(--project); border-color: var(--project); }
  .chip.event { color: var(--organization); border-color: var(--organization); }
  .chip.question { color: var(--concept); border-color: var(--concept); }
  .chip.p1 { color: #e46a6a; border-color: #e46a6a; }
  .chip.p2 { color: var(--person); border-color: var(--person); }
  .chip.p3 { color: var(--project); border-color: var(--project); }
  .chip.p4 { color: var(--ink-dim); }
  .chip.p5 { color: var(--ink-faint); }
  .mail-from { font-weight: 600; }
  .mail-count {
    font-family: "JetBrains Mono", monospace; font-size: .66rem;
    color: var(--ink-faint); margin-left: .4rem;
  }
  .area-card {
    padding: .8rem .9rem; margin-bottom: .6rem;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: .6rem;
  }
  .area-card h3 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: .98rem; margin: 0 0 .3rem;
  }
  .area-stats {

  .area-actions button {

  .dropzone {

  .ko p { margin: .15rem 0 0; font-size: .88rem; }
  .ko .who { color: var(--ink-dim); font-size: .78rem; margin-top: .15rem; }

  h2 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 1.15rem; margin: .2rem 0 .6rem; text-wrap: balance;
  }
  .empty { color: var(--ink-faint); font-size: .85rem; padding: 1rem 0; }

  /* detalle de nodo */
  .node-type {
    font-family: "JetBrains Mono", monospace; font-size: .66rem;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint);
  }
  .rel-line {
    display: flex; gap: .5rem; align-items: baseline;
    padding: .4rem 0; border-bottom: 1px solid var(--line);
    font-size: .85rem;
  }
  .rel-line .rt {
    font-family: "JetBrains Mono", monospace; font-size: .68rem;
    color: var(--accent);
  }
  .rel-line .window {
    margin-left: auto; font-family: "JetBrains Mono", monospace;
    font-size: .65rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* preguntar */
  #ask-form { display: flex; gap: .5rem; margin-bottom: .9rem; }
  #ask-input {
    flex: 1; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: .55rem;
    padding: .55rem .8rem; font: inherit; font-size: .85rem; outline: none;
  }
  #ask-input:focus { border-color: var(--accent); }
  #ask-form button {
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: .55rem; padding: .55rem .95rem;
    font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  }
  #ask-form button:focus-visible { outline: 2px solid var(--ink); }
  #ask-result {
    white-space: pre-wrap; font-size: .82rem; color: var(--ink-dim);
    font-family: "JetBrains Mono", monospace; line-height: 1.6;
  }

  .sub-nav { display: flex; gap: .3rem; margin-bottom: .8rem; flex-wrap: wrap; }
  .sub-nav button {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; color: var(--ink-dim); cursor: pointer;
    font: inherit; font-size: .72rem; padding: .2rem .7rem;
  }
  .sub-nav button.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .md h2 { font-size: 1.15rem; margin: .2rem 0 .6rem; }
  .md h3 { font-family: "Fraunces", Georgia, serif; font-size: .95rem; font-weight: 600; margin: .9rem 0 .3rem; color: var(--ink); }
  .md h4 { font-size: .82rem; margin: .7rem 0 .2rem; color: var(--ink-dim); font-weight: 600; }
  .md ul { margin: 0 0 .4rem; padding-left: 1.1rem; font-size: .86rem; }
  .md li { margin: .15rem 0; }
  .md p { font-size: .85rem; color: var(--ink-dim); margin: .3rem 0; }
  .md code { font-family: "JetBrains Mono", monospace; font-size: .78rem; background: var(--surface-2); padding: .05rem .3rem; border-radius: .3rem; }
  .verdict { font-family: "JetBrains Mono", monospace; font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; padding: .05rem .45rem; border-radius: 999px; border: 1px solid var(--line); }
  .verdict.conectar { color: var(--project); border-color: var(--project); }
  .verdict.revisar { color: var(--person); border-color: var(--person); }
  .verdict.ignorar { color: var(--ink-faint); }
  .load-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; margin: .4rem 0 .2rem; }
  .load-col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 2px; cursor: pointer; }
  .load-col .seg { width: 100%; border-radius: 0; }
  .load-col .seg.agenda { background: var(--chart-agenda); }
  .load-col .seg.tasks { background: var(--chart-tasks); border-radius: 4px 4px 0 0; }
  .load-col .seg.over { background: var(--decision); }
  .load-col .track { flex: 1; background: var(--surface-2); border-radius: 4px 4px 0 0; }
  .load-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-family: "JetBrains Mono", monospace; font-size: .62rem; color: var(--ink-faint); text-align: center; }
  .load-labels .sel { color: var(--accent); }
  .load-legend { display: flex; gap: 1rem; font-size: .72rem; color: var(--ink-dim); margin: .5rem 0 .2rem; }
  .load-legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; vertical-align: -1px; margin-right: .3rem; }
  .task-row { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid var(--line); font-size: .85rem; }
  .task-row .t { flex: 1; min-width: 0; }
  .task-row .t small { display: block; color: var(--ink-faint); font-family: "JetBrains Mono", monospace; font-size: .64rem; }
  .task-row input { width: 3.4rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: .4rem; padding: .15rem .3rem; font: inherit; font-size: .76rem; text-align: right; }
  .task-row button { background: var(--surface); border: 1px solid var(--line); border-radius: .4rem; color: var(--ink-dim); cursor: pointer; font-size: .72rem; padding: .1rem .4rem; }
  .task-row button:hover { color: var(--ink); border-color: var(--accent); }
  .task-row.overdue .t { color: var(--decision); }
  .lvl { font-family: "JetBrains Mono", monospace; font-size: .62rem; padding: .05rem .45rem; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .lvl.L0, .lvl.L1 { color: var(--ink-dim); }
  .lvl.L2 { color: var(--project); }
  .lvl.L3 { color: var(--chart-tasks); }
  .lvl.L3x { color: var(--person); }
  .lvl.L4 { color: var(--decision); }
  .q-item { padding: .6rem 0; border-bottom: 1px solid var(--line); }
  .q-item .meta { display: flex; gap: .5rem; align-items: baseline; font-family: "JetBrains Mono", monospace; font-size: .66rem; color: var(--ink-faint); margin-bottom: .15rem; }

  .q-item .acts { display: flex; gap: .3rem; margin-top: .35rem; }

  .q-item .acts button:hover { color: var(--ink); border-color: var(--accent); }
  .q-item .acts button.ok { color: var(--chart-tasks); border-color: var(--chart-tasks); }
  .q-item pre { white-space: pre-wrap; font-family: "JetBrains Mono", monospace; font-size: .72rem; color: var(--ink-dim); background: var(--surface-2); border-radius: .4rem; padding: .4rem .6rem; margin: .3rem 0 0; max-height: 9rem; overflow: auto; }
  .matrix-row { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--line); }
  .matrix-row .n { font-size: .86rem; }
  .matrix-row small { display: block; color: var(--ink-faint); font-size: .72rem; }
  .matrix-row select { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: .4rem; padding: .2rem .4rem; font: inherit; font-size: .74rem; }
  .priv { font-family: "JetBrains Mono", monospace; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; padding: .05rem .4rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-faint); }
  .priv.local { color: var(--project); border-color: var(--project); }
  .priv.read-cloud { color: var(--organization); border-color: var(--organization); }
  .priv.write-cloud { color: var(--decision); border-color: var(--decision); }
  .conn-card.off { opacity: .55; }
  .conn-form { display: grid; grid-template-columns: 1fr; gap: .4rem; margin-top: .5rem; }
  .conn-form { min-width: 0; }
  .conn-form select, .conn-form input { width: 100%; min-width: 0; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: .5rem; padding: .45rem .7rem; font: inherit; font-size: .84rem; }
  .sync-line { font-family: "JetBrains Mono", monospace; font-size: .68rem; color: var(--ink-faint); margin: .2rem 0 .8rem; }
  a.src { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  a.src:hover { border-bottom-style: solid; }
  .doc-back {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: .5rem; color: var(--ink); cursor: pointer;
    font: inherit; font-size: .78rem; padding: .3rem .7rem; margin-bottom: .7rem;
  }
  .doc-back:hover { border-color: var(--accent); }
  .doc-body {
    white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: .85rem; line-height: 1.6; color: var(--ink-dim);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: .6rem; padding: .8rem .95rem;
    max-height: 55vh; overflow-y: auto;
  }
  .demo-note {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 1.2rem; z-index: 20;
    font-family: "JetBrains Mono", monospace; font-size: .66rem;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--bg-veil); border: 1px solid var(--line);

  }
</style>

<header>
  <div class="wordmark">Segundo <em>Cerebro</em></div>
  <div class="tagline">personal cognitive os</div>
  <input id="search" type="search" placeholder="Buscar en la memoria…" autocomplete="off">
  <button id="ai-switch" class="ai-switch" title="Apagar toda la IA y volver a modo manual supervisado" onclick="toggleAI()">⏻ IA</button>
</header>
<div id="ai-banner" class="ai-banner" hidden></div>

<canvas id="graph" aria-label="Grafo de conocimiento"></canvas>

<div class="legend" aria-hidden="true">
  <span><i style="background:var(--person)"></i>Personas</span>
  <span><i style="background:var(--project)"></i>Proyectos</span>
  <span><i style="background:var(--organization)"></i>Organizaciones</span>
  <span><i style="background:var(--concept)"></i>Conceptos</span>
  <span><i style="background:var(--decision); border-radius:2px; transform:rotate(45deg)"></i>Decisiones</span>
</div>

<aside id="panel" class="open">
  <nav>
    <button data-tab="today" class="active">Hoy</button>
    <button data-tab="load">Carga</button>
    <button data-tab="areas">Áreas</button>
    <button data-tab="people">Personas</button>
    <button data-tab="memory">Memoria</button>
    <button data-tab="mail">Correo</button>
    <button data-tab="sources">Conectores</button>
    <button data-tab="auto">Auto</button>
    <button data-tab="ask">Preguntar</button>
  </nav>
  <div id="panel-body"></div>
</aside>

<div id="demo-note" class="demo-note" hidden>modo demo · datos de ejemplo</div>

<script>
"use strict";

/* ── token de sesión (app de escritorio): solo esta ventana habla con la API ── */
const SB_TOKEN = (document.querySelector('meta[name="sb-token"]') || {}).content || "";
if (SB_TOKEN) {
  const _fetch = window.fetch.bind(window);
  window.fetch = (url, opts = {}) => _fetch(url, { ...opts, headers: { ...(opts.headers || {}), "X-SB-Token": SB_TOKEN } });
}

/* ── datos de demostración (cuando la API no está disponible) ─────────── */
const DEMO = {
  graph: {
    nodes: [
      { id: "inti", name: "Inti", type: "person", degree: 6 },
      { id: "ricardo", name: "Ricardo", type: "person", degree: 3, pinned: true },
      { id: "raimundo", name: "Raimundo", type: "person", degree: 1 },
      { id: "falp", name: "FALP", type: "organization", degree: 3 },
      { id: "imperial", name: "Imperial College", type: "organization", degree: 2 },
      { id: "medismart", name: "Medismart", type: "organization", degree: 1 },
      { id: "oncodata", name: "ONCODATA", type: "project", degree: 3 },

/* ── simulación force-directed (canvas, sin dependencias) ─────────────── */
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let view = { x: 0, y: 0, k: 1 };
let nodes = [], links = [];

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
window.addEventListener("resize", resize);
resize();

function initSim() {
  const cx = W * 0.38, cy = H * 0.52;
  const byId = {};
  nodes = graph.nodes.map((n, i) => {
    const angle = (i / graph.nodes.length) * Math.PI * 2;
    const node = {
      ...n,
      x: cx + Math.cos(angle) * 160 + (Math.random() - 0.5) * 60,
      y: cy + Math.sin(angle) * 160 + (Math.random() - 0.5) * 60,
      vx: 0, vy: 0,
      r: 6 + Math.min(10, (n.degree || 0) * 1.6),
    };
    byId[n.id] = node;
    return node;
  });
  links = graph.links
    .map(l => ({ ...l, a: byId[l.source], b: byId[l.target] }))
    .filter(l => l.a && l.b);
}

let alpha = 1;
function tick() {
  alpha = Math.max(0.02, alpha * 0.995);
  // repulsión
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 1;
      if (d2 > 250000) continue;
      const f = 2600 / d2 * alpha;
      const d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }
  // resortes
  for (const l of links) {
    let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - 110) * 0.015 * alpha * 4;
    dx /= d; dy /= d;
    l.a.vx += dx * f; l.a.vy += dy * f;
    l.b.vx -= dx * f; l.b.vy -= dy * f;
  }
  // gravedad suave hacia el centro del área visible del grafo
  const cx = W * 0.38, cy = H * 0.52;
  for (const n of nodes) {
    n.vx += (cx - n.x) * 0.0012 * alpha * 4;
    n.vy += (cy - n.y) * 0.0012 * alpha * 4;
    if (n !== dragNode) {
      n.x += n.vx; n.y += n.vy;
    }
    n.vx *= 0.86; n.vy *= 0.86;
  }
}

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function draw() {
  tick();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);

  const colors = {
    person: css("--person"), project: css("--project"),
    organization: css("--organization"), concept: css("--concept"),
    decision: css("--decision"),
  };
  const edgeColor = css("--edge");
  const inkDim = css("--ink-dim");
  const ink = css("--ink");
  const bg = css("--bg");

  const focus = hovered || selected;
  const neighborhood = new Set();
  if (focus) {
    neighborhood.add(focus.id);
    for (const l of links) {
      if (l.a.id === focus.id) neighborhood.add(l.b.id);
      if (l.b.id === focus.id) neighborhood.add(l.a.id);
    }
  }

  // aristas
  for (const l of links) {
    const active = focus && (l.a.id === focus.id || l.b.id === focus.id);
    ctx.strokeStyle = active ? css("--accent") : edgeColor;
    ctx.globalAlpha = focus ? (active ? 0.9 : 0.12) : 0.55;
    ctx.lineWidth = active ? 1.4 : 1;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.stroke();
    if (active && view.k > 0.7) {
      const mx = (l.a.x + l.b.x) / 2, my = (l.a.y + l.b.y) / 2;
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = inkDim;
      ctx.font = "9px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(l.type, mx, my - 4);
    }
  }

  // nodos
  for (const n of nodes) {
    const color = colors[n.type] || inkDim;
    const dimmed = focus && !neighborhood.has(n.id);
    ctx.globalAlpha = dimmed ? 0.18 : 1;

    if (focus && n.id === focus.id) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 9, 0, Math.PI * 2);
      ctx.fillStyle = css("--glow");
      ctx.fill();
    }
    ctx.beginPath();
    if (n.type === "decision") {
      const r = n.r + 1;                       // rombo: la decisión destaca
      ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y);
      ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = bg;
    ctx.stroke();
    if (n.pinned) {                            // persona fijada por el usuario
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = css("--accent");
      ctx.stroke();
    }

    ctx.fillStyle = dimmed ? inkDim : ink;
    ctx.font = (n.id === (focus && focus.id) ? "600 " : "") + "11.5px 'Albert Sans', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(n.name, n.x, n.y + n.r + 14);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── interacción: hover, drag, pan, zoom ──────────────────────────────── */
let dragNode = null, panning = false, last = null;

const toWorld = (px, py) => ({ x: (px - view.x) / view.k, y: (py - view.y) / view.k });

function nodeAt(px, py) {
  const p = toWorld(px, py);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = p.x - n.x, dy = p.y - n.y;
    if (dx * dx + dy * dy < (n.r + 6) * (n.r + 6)) return n;
  }
  return null;
}

canvas.addEventListener("pointerdown", (e) => {
  const n = nodeAt(e.clientX, e.clientY);
  if (n) { dragNode = n; alpha = Math.max(alpha, 0.3); }
  else { panning = true; canvas.classList.add("dragging"); }
  last = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (dragNode) {
    const p = toWorld(e.clientX, e.clientY);
    dragNode.x = p.x; dragNode.y = p.y;
    alpha = Math.max(alpha, 0.25);
  } else if (panning && last) {
    view.x += e.clientX - last.x;
    view.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
  } else {
    hovered = nodeAt(e.clientX, e.clientY);
    canvas.style.cursor = hovered ? "pointer" : "grab";
  }
});
canvas.addEventListener("pointerup", (e) => {
  if (dragNode && last && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 4) {
    selectNode(dragNode);
  }
  dragNode = null; panning = false; last = null;
  canvas.classList.remove("dragging");
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const k = Math.min(3, Math.max(0.35, view.k * factor));
  const p = toWorld(e.clientX, e.clientY);
  view.x = e.clientX - p.x * k;
  view.y = e.clientY - p.y * k;
  view.k = k;
}, { passive: false });

function mailCard(m) {

async function captureMail(id, account) {
  const box = document.getElementById(`cap-${esc(account + ":" + id)}`);
  if (demoMode) {
    if (box) box.innerHTML = "Simulación (demo): en tu instancia local este correo se guardaría en <code>.brain/captured/</code> y entraría a la memoria — solo este, por tu decisión.";
    return;
  }
  if (box) box.textContent = "Capturando…";
  try {
    const res = await fetch("/api/mail/capture", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, account }) });
    const data = await res.json();
    if (data.error) { if (box) box.textContent = "Error: " + data.error; return; }
    if (data.duplicate) { if (box) box.textContent = "Ya estaba capturado."; return; }
    if (box) box.innerHTML = `Capturado → área ${esc(data.area || "sin área")} · ${data.kos} KOs · <a class="src" href="#" onclick="viewDoc('${esc(data.doc_id)}');return false">ver nota</a>`;

function renderMail() {
  if (!mail.length) {
    panelBody.innerHTML = `<h2>Triaje de correo</h2>

      y recarga esta página. Solo lectura: tu bandeja nunca se modifica.</div>`;

  const byP = {};

  let html = `<h2>Triaje de correo</h2>`;
  for (const p of [1, 2, 3, 4, 5]) {

    html += `<div class="node-type" style="margin-top:.9rem">${PRIORITY_LABELS[p]}` +
            `<span class="mail-count">${byP[p].length}</span></div>`;

}

function demoOverride(id, payload) {
  // misma lógica que priority.py, en el navegador: pin asc → score desc
  const a = areasData.find(x => x.id === id);
  if (!a) return;
  if (payload.weight != null) a.weight = payload.weight;
  if (payload.pin != null) a.pin = payload.pin;
  if (payload.unpin) a.pin = null;
  for (const x of areasData) {
    x.score = Math.round((x.score_auto ?? x.score) * (x.weight ?? 1) * 10) / 10;
  }
  areasData.sort((x, y) => {
    if ((x.pin != null) !== (y.pin != null)) return x.pin != null ? -1 : 1;
    if (x.pin != null && y.pin != null) return x.pin - y.pin;
    return (y.score || 0) - (x.score || 0);
  });
  areasData.forEach((x, i) => { x.rank = i + 1; });
  renderAreas();
}

async function overrideArea(id, payload) {
  if (demoMode) return demoOverride(id, payload);
  try {
    const res = await fetch("/api/areas/override", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, ...payload }),
    });
    const data = await res.json();
    if (data.areas) { areasData = data.areas; renderAreas(); }
  } catch { /* servidor no disponible */ }
}

function renderAreas() {
  if (!areasData.length) {
    panelBody.innerHTML = `<h2>Áreas de trabajo</h2>
      <div class="empty">Tu memoria está vacía o sin áreas asignadas. Sube un
      documento en la pestaña <b>Conectores</b>, o corre <code>sb ingest brain/</code>
      y <code>sb areas assign</code> (clasificación 100% local).</div>`;
    return;
  }
  const maxScore = Math.max(1, ...areasData.map(a => a.score || 0));
  panelBody.innerHTML = `<h2>Áreas por prioridad</h2>` + areasData.map(a => `
    <div class="area-card${a.status === "pausada" ? '" style="opacity:.55' : ''}">
      <div class="area-head">
        <span class="area-rank">#${a.rank ?? "·"}${a.pin != null ? " 📌" : ""}</span>
        <h3>${esc(a.name)}</h3>
        <div class="area-actions">
          <button title="Más prioridad"
            onclick="overrideArea('${esc(a.id)}', {weight: ${(a.weight || 1) + 0.25}})">▲</button>
          <button title="Menos prioridad"
            onclick="overrideArea('${esc(a.id)}', {weight: ${Math.max(0.25, (a.weight || 1) - 0.25)}})">▼</button>
          <button title="${a.pin != null ? "Soltar pin" : "Fijar arriba"}"
            onclick="overrideArea('${esc(a.id)}', ${a.pin != null ? "{unpin: true}" : "{pin: 1}"})">📌</button>
        </div>
      </div>
      <div class="area-bar"><i style="width:${Math.round(100 * (a.score || 0) / maxScore)}%"></i></div>
      <div class="area-stats">
        <span>score <b>${a.score ?? 0}</b></span>
        <span>peso <b>${a.weight ?? 1}</b></span>
        <span>${esc(a.signals_label || "")}</span>
      </div>
      <div class="area-stats" style="margin-top:.25rem">
        <span><b>${a.documents ?? 0}</b> docs</span>
        <span><b>${a.kos ?? 0}</b> KOs</span>
        <span><b>${a.tasks_open ?? 0}</b> tareas</span>
        <span><b>${a.decisions ?? 0}</b> decisiones</span>
      </div>
    </div>`).join("");
}

function bindDropzone() {
  const zone = document.getElementById("dropzone");
  const input = document.getElementById("file-input");
  zone.addEventListener("click", () => input.click());
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("over");
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });
  input.addEventListener("change", () => {
    if (input.files[0]) uploadFile(input.files[0]);
  });
}

async function uploadFile(file) {
  const out = document.getElementById("upload-result");
  out.textContent = `Subiendo ${file.name}…`;
  if (demoMode) {
    out.innerHTML = `Simulación (demo): «${esc(file.name)}» se guardaría en
      <code>.brain/uploads/</code>, se ingestaría y se clasificaría por área —
      todo en tu máquina, nada se envió a ninguna parte. En tu instancia local
      (<code>sb serve</code>) esta subida es real.`;
    return;
  }
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "X-Filename": encodeURIComponent(file.name) },
      body: await file.arrayBuffer(),
    });
    const data = await res.json();
    if (data.error) { out.textContent = "Error: " + data.error; return; }
    if (data.duplicate) { out.textContent = "Ese documento ya estaba en la memoria."; return; }
    out.textContent = `Listo: «${data.title}» → área ${data.area || "sin área"} · ${data.kos} knowledge objects.`;
    try { areasData = await api("/api/areas"); } catch {}
    try { graph = await api("/api/graph"); initSim(); } catch {}
  } catch (err) {
    out.textContent = "Error subiendo: " + err.message;
  }
}

  const btn = document.getElementById("ai-switch");

  btn.classList.toggle("off", off);
  document.body.classList.toggle("ai-off", off);

async function loadAI() {
  if (demoMode) { renderAI(); return; }
  try { aiState = await api("/api/ai"); } catch { aiState = { enabled: true }; }
  renderAI();
}

async function toggleAI() {
  const off = aiState && aiState.enabled === false;
  if (!off) {
    const ok = confirm("APAGAR LA IA\n\nSe detiene toda llamada a Claude (extracción, triaje, borradores, preguntas) y toda automatización (tarea programada, enriquecimiento). El sistema queda en modo manual supervisado: solo lo que tú ejecutes, 100% local.\n\nTu memoria no se toca. Puedes reactivar cuando quieras.\n\n¿Apagar ahora?");
    if (!ok) return;
    const reason = prompt("Motivo (opcional, queda en el registro):", "") || "";
    if (demoMode) { aiState = { enabled: false, off_at: new Date().toISOString().slice(0, 16), reason }; renderAI(); renderTab(); return; }
    try {
      const res = await fetch("/api/ai/off", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason }) });
      aiState = await res.json();
    } catch (err) { alert("No pude apagar la IA: " + err.message); return; }
  } else {

function mdToHtml(md) {
  const lines = md.split("\n");
  let html = "", inList = false;
  const inline = (t) => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>");
  for (const raw of lines) {
    const line = raw.trim();                 // listas anidadas ("  - ") se aplanan
    if (line.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.startsWith("### ")) html += `<h4>${inline(line.slice(4))}</h4>`;
    else if (line.startsWith("## ")) html += `<h3>${inline(line.slice(3))}</h3>`;
    else if (line.startsWith("# ")) html += `<h2>${inline(line.slice(2))}</h2>`;
    else if (line === "---") html += "<hr style='border:0;border-top:1px solid var(--line);margin:.8rem 0'>";
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function syncLine(st) {
  if (!st) return "";
  const when = st.running ? "sincronizando ahora…"
    : st.minutes_ago == null ? "aún sin sincronizar"
    : st.minutes_ago < 60 ? `última sincronización hace ${st.minutes_ago} min`
    : `última sincronización hace ${Math.round(st.minutes_ago / 60)} h`;
  const bad = st.last && st.last.ok === false ? " · con errores (ver .brain/logs/)" : "";
  const counts = st.counts && st.counts.documents != null
    ? ` · ${st.counts.documents} docs · ${st.counts.kos} KOs` : "";
  const manual = (aiState && aiState.enabled === false) ? " · manual: solo a pedido" : "";
  const ver = st.version ? ` · v${st.version}` : "";
  return `<div class="sync-line" id="sync-line">${esc(when)}${esc(bad)}${esc(counts)}${esc(manual)}${esc(ver)}
    <button class="doc-back" style="margin:0 0 0 .6rem;padding:.1rem .5rem;font-size:.7rem"
      ${st.running ? "disabled" : ""} onclick="refreshNow()">${st.running ? "…" : "Actualizar ahora"}</button></div>`;
}

  if (action === "undo") it.status = "undone";
  const s = queueData.summary; for (const k in s) s[k] = queueData.items.filter(x => x.status === k).length;

async function queueAction(action, id) {

  try {
    const res = await fetch(`/api/queue/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

  const preview = it.payload && (it.payload.markdown || it.payload.body)

  const hint = it.result && it.result.hint ? `<div class="who">↳ ${esc(it.result.hint)}</div>` : "";

    <div class="meta"><span class="${lvlClass(it.level)}">${esc(it.level)}</span><span>${esc(it.status)}</span><span>${esc((it.created_at || "").slice(0, 16).replace("T", " "))}</span><span>${esc(it.action)}</span></div>

/* ── carga: hoy y 7 días ──────────────────────────────────────────────── */
async function loadWorkload(force) {
  if (demoMode) {
    if (!workloadData) workloadData = JSON.parse(JSON.stringify(DEMO.workload));
    return workloadData;
  }
  if (!workloadData || force) workloadData = await api("/api/workload");
  return workloadData;
}

function demoRecalc() {
  for (const d of workloadData.days) {
    d.planned_h = Math.round(d.items.reduce((a, i) => a + Number(i.effort_h || 0), 0) * 10) / 10;
    const focus = Math.max(0, (d.capacity_h - d.meetings_h) * 0.6);
    d.free_h = Math.max(0, Math.round((focus - d.planned_h) * 10) / 10);
    d.load_pct = d.capacity_h ? Math.round(100 * (d.meetings_h + d.planned_h) / d.capacity_h) : 0;
    d.overloaded = d.planned_h > focus + 1e-9;
  }
  workloadData.totals.tasks = workloadData.days.reduce((a, d) => a + d.items.length, 0);
  workloadData.totals.overloaded_days = workloadData.days.filter(d => d.overloaded).map(d => d.date);
}

async function updateKo(id, payload) {
  if (demoMode) {
    for (const d of workloadData.days) {
      const i = d.items.findIndex(x => x.id === id);
      if (i < 0) continue;
      const it = d.items[i];
      if (payload.status === "done") d.items.splice(i, 1);
      if (payload.effort_h != null) it.effort_h = Number(payload.effort_h);
      if (payload.scheduled_for) {
        d.items.splice(i, 1);
        const target = workloadData.days.find(x => x.date === payload.scheduled_for);
        if (target) { it.fixed = true; target.items.push(it); }
      }
      break;
    }
    demoRecalc();
    renderWorkload();
    return;
  }
  try {
    const res = await fetch("/api/kos/update", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, ...payload }) });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    workloadData = data.workload;
    try { kos = await api("/api/kos"); } catch {}
    renderWorkload();
  } catch (err) { alert("No pude actualizar: " + err.message); }
}

function taskRow(it, dayIdx) {
  const next = workloadData.days.slice(dayIdx + 1).find(d => d.capacity_h > 0);
  const due = it.valid_to ? `vence ${esc(it.valid_to)}` : "sin vencimiento";
  return `<div class="task-row${it.overdue ? " overdue" : ""}">
    <div class="t">${it.overdue ? "⚠ " : ""}${esc(it.title)}${it.fixed ? " 📌" : ""}
      <small>${due} · ${esc(it.area || "sin área")} · esfuerzo ${esc(it.effort_origin || "")}</small></div>
    <input type="number" step="0.5" min="0.1" value="${it.effort_h}" title="Esfuerzo (h)"
      onchange="updateKo('${esc(it.id)}', {effort_h: this.value})">
    ${next ? `<button title="Mover a ${esc(next.weekday)} ${esc(next.date)}" onclick="updateKo('${esc(it.id)}', {scheduled_for: '${esc(next.date)}', fixed: true})">→</button>` : ""}
    <button title="Cerrar" onclick="updateKo('${esc(it.id)}', {status: 'done'})">✔</button>
  </div>`;
}

async function renderWorkload() {
  panelBody.innerHTML = `<h2>Carga</h2><div class="empty">Calculando capacidad y planificación…</div>`;
  let w;
  try { w = await loadWorkload(); } catch (err) {
    panelBody.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; return;
  }
  if (!w.days || !w.days.length) {
    panelBody.innerHTML = `<h2>Carga</h2><div class="empty">Sin memoria local: la carga se calcula en tu instancia (sb serve).</div>`;
    return;
  }
  const maxH = Math.max(1, ...w.days.map(d => Math.max(d.capacity_h, d.meetings_h + d.planned_h)));
  const px = h => Math.round(120 * h / maxH);
  const cols = w.days.map((d, i) => {
    const over = Math.max(0, d.meetings_h + d.planned_h - d.capacity_h);
    const tasksH = d.planned_h - over;
    return `<div class="load-col" title="${esc(d.weekday)} ${esc(d.date)} · ${d.load_pct}%" onclick="loadDay=${i};renderWorkload()">
      ${over > 0 ? `<div class="seg over" style="height:${px(over)}px"></div>` : ""}
      ${d.planned_h > 0 ? `<div class="seg tasks" style="height:${px(Math.max(0, tasksH))}px"></div>` : ""}
      ${d.meetings_h > 0 ? `<div class="seg agenda" style="height:${px(d.meetings_h)}px"></div>` : ""}
      ${d.capacity_h > 0 && d.meetings_h + d.planned_h < d.capacity_h ? `<div class="track" style="height:${px(d.capacity_h - d.meetings_h - d.planned_h)}px;flex:0 0 auto"></div>` : ""}
    </div>`;
  }).join("");
  const labels = w.days.map((d, i) => `<div class="${i === loadDay ? "sel" : ""}">${esc(d.weekday)}<br>${d.capacity_h ? d.load_pct + "%" : "—"}</div>`).join("");
  const today = w.days[0];
  const sel = w.days[Math.min(loadDay, w.days.length - 1)];
  const t = w.totals || {};
  panelBody.innerHTML = `<h2>Carga</h2>
    <div class="sync-line">hoy: ${today.meetings_h} h agenda + ${today.planned_h} h tareas / ${today.capacity_h} h
      ${today.overloaded ? " · ⚠ sobrecargado" : ""} · semana: ${t.planned_h || 0} h de tareas en ${t.capacity_h || 0} h</div>
    <div class="load-strip">${cols}</div>
    <div class="load-labels">${labels}</div>
    <div class="load-legend"><span><i style="background:var(--chart-agenda)"></i>agenda</span>
      <span><i style="background:var(--chart-tasks)"></i>tareas planificadas</span>
      <span><i style="background:var(--decision)"></i>no cabe</span></div>
    <div class="node-type" style="margin-top:.8rem">${esc(sel.weekday)} ${esc(sel.date)} · ${sel.capacity_h ? `${sel.meetings_h} h agenda · ${sel.planned_h} h tareas · ${sel.free_h} h libres` : "sin jornada"}</div>
    ${sel.items.length ? sel.items.map(it => taskRow(it, Math.min(loadDay, w.days.length - 1))).join("")
      : `<div class="empty">Nada planificado este día.</div>`}
    ${(w.unscheduled || []).length ? `<div class="node-type" style="margin-top:1rem">sin espacio esta semana</div>` +
      w.unscheduled.map(u => `<div class="task-row"><div class="t">${esc(u.title)}<small>${u.effort_h} h${u.valid_to ? " · vence " + esc(u.valid_to) : ""}</small></div>
        <button title="Cerrar" onclick="updateKo('${esc(u.id)}', {status: 'done'})">✔</button></div>`).join("") : ""}
    <div class="sync-line" style="margin-top:.8rem">Esfuerzo: edítalo en la casilla · → mueve al siguiente día hábil (queda fijada) · ✔ cierra. Jornada en <code>.brain/config.json → workday</code>.</div>`;
}

/* ── conectores (SDK) ─────────────────────────────────────────────────── */
async function loadConnectors() {
  if (demoMode) {
    if (!connectorsData) connectorsData = { instances: DEMO.connectors.map(c => ({ ...c })), types: DEMO.connectorTypes };
    return connectorsData;
  }
  connectorsData = await api("/api/connectors");
  return connectorsData;
}

async function connectorAction(action, payload) {
  const box = document.getElementById("conn-msg");
  if (demoMode) {
    const list = connectorsData.instances;
    if (action === "remove") {
      const i = list.findIndex(c => c.id === payload.id);
      if (i >= 0) {
        if (list[i].type.startsWith("g")) { list[i].enabled = false; if (payload.purge) list[i].documents = 0; }
        else list.splice(i, 1);
      }
    } else if (action === "add") {
      const t = connectorsData.types.find(x => x.id === payload.type);
      const label = (payload.config.alias || payload.config.path || payload.config.account || "nuevo").split(/[\\/]/).pop();
      list.push({ id: `${payload.type}:${label}`, type: payload.type, type_name: t ? t.name : payload.type, privacy: t ? t.privacy : "local", label, enabled: true, last_sync: null, documents: 0, last_result: null });
    } else if (action === "sync") {
      const c = list.find(x => x.id === payload.id); if (c) { c.last_sync = new Date().toISOString(); c.last_result = { added: 3, unchanged: c.documents }; c.documents += 3; }
    } else if (action === "test") {
      if (box) box.textContent = `Simulación (demo): ✔ ${payload.id} accesible.`;
      return;
    }
    renderConnectors(true);
    return;
  }
  if (box) box.textContent = action === "sync" ? "Sincronizando…" : action === "test" ? "Probando…" : "…";
  try {
    const res = await fetch(`/api/connectors/${action}`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.error) { if (box) box.textContent = "Error: " + data.error; return; }
    connectorsData = { instances: data.instances, types: data.types };
    let msg = "";
    if (action === "test") msg = `${data.ok ? "✔" : "✘"} ${esc(data.detail || "")}`;
    if (action === "sync") { const s = data.summary || {}; msg = `Sincronizado: ${s.documents || 0} documentos nuevos · ${s.knowledge_objects || 0} KOs`; }
    if (action === "remove") msg = data.purged ? `Desconectado: borrados ${data.documents} documentos, ${data.kos} KOs.` : "Desconectado; sus documentos siguen en la memoria.";
    if (action === "add") msg = `Conectado: ${esc(data.instance.id)}`;
    await renderConnectors(true);
    const b2 = document.getElementById("conn-msg"); if (b2) b2.textContent = msg;
    if (action === "sync" || action === "remove") {
      try { graph = await api("/api/graph"); initSim(); kos = await api("/api/kos"); areasData = await api("/api/areas"); } catch {}
    }
  } catch (err) { if (box) box.textContent = "Error: " + err.message; }
}

function removeConnector(id) {
  const purge = confirm(`Desconectar ${id}.\n\n¿Borrar también de la memoria todo lo que aportó (documentos, decisiones, compromisos derivados)?\n\nAceptar = desconectar y borrar sus datos · Cancelar = solo desconectar (los datos quedan)`);
  connectorAction("remove", { id, purge });
}

function connectorCard(c) {
  const last = c.last_sync ? `sync ${esc(c.last_sync.slice(0, 16).replace("T", " "))}` : "sin sincronizar";
  const err = c.last_result && c.last_result.error ? `<div class="who" style="color:var(--decision)">✘ ${esc(c.last_result.error)}</div>` : "";
  const isGoogle = c.type === "gdrive" || c.type === "gcalendar" || c.type === "gmail";
  return `<div class="area-card conn-card${c.enabled ? "" : " off"}">
    <div class="area-head">
      <span class="priv ${esc(c.privacy)}">${esc(c.privacy)}</span>
      <h3>${esc(c.label)} <span class="who">· ${esc(c.type_name)}</span></h3>
      <div class="area-actions">
        <button title="Probar" onclick="connectorAction('test', {id: '${esc(c.id)}'})">Probar</button>
        ${c.enabled && c.type !== "gmail" ? `<button title="Sincronizar ahora" onclick="connectorAction('sync', {id: '${esc(c.id)}'})">Sync</button>` : ""}
        ${c.enabled ? `<button title="Desconectar" onclick="removeConnector('${esc(c.id)}')">✕</button>` : `<button title="Reconectar" onclick="connectorAction('add', {type: '${esc(c.type)}', config: ${esc(JSON.stringify(c.config || {}))}})">↺</button>`}
      </div>
    </div>
    <div class="area-stats"><span><b>${c.documents}</b> docs</span><span>${last}</span>
      <span>${c.enabled ? "" : "desconectado"}${isGoogle && !c.enabled ? " · autorización conservada" : ""}</span></div>
    ${err}
  </div>`;
}

    const data = await res.json();

  const rels = links.filter(l => l.a.id === n.id || l.b.id === n.id);
  const relHtml = rels.map(l => {
    const other = l.a.id === n.id ? l.b : l.a;
    const win = `${l.valid_from || "?"} → ${l.valid_to || "vigente"}`;
    return `<div class="rel-line"><span class="rt">${esc(l.type)}</span><span>${esc(other.name)}</span><span class="window">${esc(win)}</span></div>`;
  }).join("");
  const related = kos.filter(k => (k.people || []).includes(n.name) ||
    k.project === n.name || (k.statement || "").includes(n.name));
  panelBody.innerHTML = `
    <div class="node-type">${esc(n.type)}</div>
    <h2>${esc(n.name)}</h2>

    ${related.length ? "<h2 style='margin-top:1.1rem'>Memoria asociada</h2>" + related.map(koCard).join("") : ""}`;
}

/* ── preguntar / buscar ───────────────────────────────────────────────── */
async function onAsk(e) {
  e.preventDefault();
  const q = document.getElementById("ask-input").value.trim();
  if (!q) return;
  const out = document.getElementById("ask-result");
  out.classList.remove("empty");
  out.textContent = "Construyendo context pack…";
  if (demoMode) {
    out.textContent = "Modo demo: conecta el backend (sb serve) para consultar tu memoria real.";
    return;
  }
  try {
    const res = await api("/api/context?q=" + encodeURIComponent(q));
    out.textContent = res.markdown;
  } catch (err) {
    out.textContent = "Error consultando la memoria: " + err.message;
  }
}

let searchTimer = null;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim().toLowerCase();
  searchTimer = setTimeout(() => {
    if (!q) { hovered = null; return; }
    hovered = nodes.find(n => n.name.toLowerCase().includes(q)) || null;
    if (hovered) selectNode(hovered);
  }, 250);
});

loadData();
</script>
