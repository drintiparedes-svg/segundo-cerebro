/* ── simulación force-directed (canvas, sin dependencias) ─────────────── */
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let view = { x: 0, y: 0, k: 1 };
let nodes = [], links = [];

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
window.addEventListener("resize", resize);
resize();

function initSim() {
  const cx = W * 0.38, cy = H * 0.52;
  const byId = {};
  nodes = graph.nodes.map((n, i) => {
    const angle = (i / graph.nodes.length) * Math.PI * 2;
    const node = {
      ...n,
      x: cx + Math.cos(angle) * 160 + (Math.random() - 0.5) * 60,
      y: cy + Math.sin(angle) * 160 + (Math.random() - 0.5) * 60,
      vx: 0, vy: 0,
      r: 6 + Math.min(10, (n.degree || 0) * 1.6),
    };
    byId[n.id] = node;
    return node;
  });
  links = graph.links
    .map(l => ({ ...l, a: byId[l.source], b: byId[l.target] }))
    .filter(l => l.a && l.b);
}

let alpha = 1;
function tick() {
  alpha = Math.max(0.02, alpha * 0.995);
  // repulsión
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 1;
      if (d2 > 250000) continue;
      const f = 2600 / d2 * alpha;
      const d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f;
      b.vx += dx * f; b.vy += dy * f;
    }
  }
  // resortes
  for (const l of links) {
    let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - 110) * 0.015 * alpha * 4;
    dx /= d; dy /= d;
    l.a.vx += dx * f; l.a.vy += dy * f;
    l.b.vx -= dx * f; l.b.vy -= dy * f;
  }
  // gravedad suave hacia el centro del área visible del grafo
  const cx = W * 0.38, cy = H * 0.52;
  for (const n of nodes) {
    n.vx += (cx - n.x) * 0.0012 * alpha * 4;
    n.vy += (cy - n.y) * 0.0012 * alpha * 4;
    if (n !== dragNode) {
      n.x += n.vx; n.y += n.vy;
    }
    n.vx *= 0.86; n.vy *= 0.86;
  }
}

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function draw() {
  tick();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);

  const colors = {
    person: css("--person"), project: css("--project"),
    organization: css("--organization"), concept: css("--concept"),
    decision: css("--decision"),
  };
  const edgeColor = css("--edge");
  const inkDim = css("--ink-dim");
  const ink = css("--ink");
  const bg = css("--bg");

  const focus = hovered || selected;
  const neighborhood = new Set();
  if (focus) {
    neighborhood.add(focus.id);
    for (const l of links) {
      if (l.a.id === focus.id) neighborhood.add(l.b.id);
      if (l.b.id === focus.id) neighborhood.add(l.a.id);
    }
  }

  // aristas
  for (const l of links) {
    const active = focus && (l.a.id === focus.id || l.b.id === focus.id);
    ctx.strokeStyle = active ? css("--accent") : edgeColor;
    ctx.globalAlpha = focus ? (active ? 0.9 : 0.12) : 0.55;
    ctx.lineWidth = active ? 1.4 : 1;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.stroke();
    if (active && view.k > 0.7) {
      const mx = (l.a.x + l.b.x) / 2, my = (l.a.y + l.b.y) / 2;
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = inkDim;
      ctx.font = "9px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(l.type, mx, my - 4);
    }
  }

  // nodos
  for (const n of nodes) {
    const color = colors[n.type] || inkDim;
    const dimmed = focus && !neighborhood.has(n.id);
    ctx.globalAlpha = dimmed ? 0.18 : 1;

    if (focus && n.id === focus.id) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 9, 0, Math.PI * 2);
      ctx.fillStyle = css("--glow");
      ctx.fill();
    }
    ctx.beginPath();
    if (n.type === "decision") {
      const r = n.r + 1;                       // rombo: la decisión destaca
      ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y);
      ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    }
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = bg;
    ctx.stroke();
    if (n.pinned) {                            // persona fijada por el usuario
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 4, 0, Math.PI * 2);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = css("--accent");
      ctx.stroke();
    }

    ctx.fillStyle = dimmed ? inkDim : ink;
    ctx.font = (n.id === (focus && focus.id) ? "600 " : "") + "11.5px 'Albert Sans', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(n.name, n.x, n.y + n.r + 14);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── interacción: hover, drag, pan, zoom ──────────────────────────────── */
let dragNode = null, panning = false, last = null;

const toWorld = (px, py) => ({ x: (px - view.x) / view.k, y: (py - view.y) / view.k });

function nodeAt(px, py) {
  const p = toWorld(px, py);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = p.x - n.x, dy = p.y - n.y;
    if (dx * dx + dy * dy < (n.r + 6) * (n.r + 6)) return n;
  }
  return null;
}

canvas.addEventListener("pointerdown", (e) => {
  const n = nodeAt(e.clientX, e.clientY);
  if (n) { dragNode = n; alpha = Math.max(alpha, 0.3); }
  else { panning = true; canvas.classList.add("dragging"); }
  last = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (dragNode) {
    const p = toWorld(e.clientX, e.clientY);
    dragNode.x = p.x; dragNode.y = p.y;
    alpha = Math.max(alpha, 0.25);
  } else if (panning && last) {
    view.x += e.clientX - last.x;
    view.y += e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
  } else {
    hovered = nodeAt(e.clientX, e.clientY);
    canvas.style.cursor = hovered ? "pointer" : "grab";
  }
});
canvas.addEventListener("pointerup", (e) => {
  if (dragNode && last && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 4) {
    selectNode(dragNode);
  }
  dragNode = null; panning = false; last = null;
  canvas.classList.remove("dragging");
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const k = Math.min(3, Math.max(0.35, view.k * factor));
  const p = toWorld(e.clientX, e.clientY);
  view.x = e.clientX - p.x * k;
  view.y = e.clientY - p.y * k;
  view.k = k;
}, { passive: false });

function demoOverride(id, payload) {
  // misma lógica que priority.py, en el navegador: pin asc → score desc
  const a = areasData.find(x => x.id === id);
  if (!a) return;
  if (payload.weight != null) a.weight = payload.weight;
  if (payload.pin != null) a.pin = payload.pin;
  if (payload.unpin) a.pin = null;
  for (const x of areasData) {
    x.score = Math.round((x.score_auto ?? x.score) * (x.weight ?? 1) * 10) / 10;
  }
  areasData.sort((x, y) => {
    if ((x.pin != null) !== (y.pin != null)) return x.pin != null ? -1 : 1;
    if (x.pin != null && y.pin != null) return x.pin - y.pin;
    return (y.score || 0) - (x.score || 0);
  });
  areasData.forEach((x, i) => { x.rank = i + 1; });
  renderAreas();
}

function bindDropzone() {

  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("over");
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
  });
  input.addEventListener("change", () => {

  const out = document.getElementById("upload-result");
  out.textContent = `Subiendo ${file.name}…`;

      todo en tu máquina, nada se envió a ninguna parte. En tu instancia local
      (<code>sb serve</code>) esta subida es real.`;
    return;
  }
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "X-Filename": encodeURIComponent(file.name) },
      body: await file.arrayBuffer(),
    });
    const data = await res.json();
    if (data.error) { out.textContent = "Error: " + data.error; return; }
    if (data.duplicate) { out.textContent = "Ese documento ya estaba en la memoria."; return; }
    out.textContent = `Listo: «${data.title}» → área ${data.area || "sin área"} · ${data.kos} knowledge objects.`;

    try { graph = await api("/api/graph"); initSim(); } catch {}
  } catch (err) {
    out.textContent = "Error subiendo: " + err.message;

}

    decisions: kos.filter(k => k.ko_type === "decision"),
    tasks: kos.filter(k => k.ko_type === "task" && k.status === "active"),
    timeline: kos.filter(k => k.ko_type === "event").sort((a, b) => b.date.localeCompare(a.date)),
  };
  const titles = { decisions: "Registro de decisiones", tasks: "Compromisos abiertos", timeline: "Memoria episódica" };

    (items.length ? items.map(koCard).join("") :
      `<div class="empty">Aún no hay registros. Sube un documento en <b>Fuentes</b> o corre <code>sb ingest brain/</code>.</div>`);
}

/* ── hoy: brief del día ───────────────────────────────────────────────── */
function mdToHtml(md) {
  const lines = md.split("\n");
  let html = "", inList = false;
  const inline = (t) => esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/(^|\s)_(.+?)_(?=\s|$)/g, "$1<i>$2</i>");
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.startsWith("- ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (line.startsWith("### ")) html += `<h4>${inline(line.slice(4))}</h4>`;
    else if (line.startsWith("## ")) html += `<h3>${inline(line.slice(3))}</h3>`;
    else if (line.startsWith("# ")) html += `<h2>${inline(line.slice(2))}</h2>`;
    else if (line === "---") html += "<hr style='border:0;border-top:1px solid var(--line);margin:.8rem 0'>";
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

async function renderToday() {
  if (demoMode) {
    panelBody.innerHTML = `<div class="md">${mdToHtml(DEMO.today)}</div>`;
    return;
  }
  panelBody.innerHTML = `<h2>Tu día</h2><div class="empty">Construyendo el brief desde tu memoria…</div>`;
  try {
    const res = await api("/api/today");
    panelBody.innerHTML = `<div class="md">${mdToHtml(res.markdown)}</div>`;
  } catch (err) {
    panelBody.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

/* ── personas clave ───────────────────────────────────────────────────── */
async function loadPeople() {
  if (demoMode) {
    if (!peopleData) peopleData = { people: DEMO.people.map(p => ({ ...p })),
      suggested: [...DEMO.suggested], unknown_senders: DEMO.unknown_senders };
    return peopleData;
  }
  peopleData = await api("/api/people");
  return peopleData;
}

function demoPinPerson(name, pin) {
  const p = peopleData.people.find(x => x.name === name);
  if (p) p.pinned = pin;
  peopleData.people.sort((a, b) => (a.pinned === b.pinned ? b.score - a.score : a.pinned ? -1 : 1));
  peopleData.people.forEach((x, i) => { x.rank = i + 1; });
  peopleData.suggested = peopleData.suggested.filter(n => n !== name);
  for (const n of nodes) if (n.type === "person" && n.name === name) n.pinned = pin;
  renderPeople();
}

async function pinPerson(name, pin) {
  if (demoMode) return demoPinPerson(name, pin);
  try {
    const res = await fetch("/api/people/pin", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, pin }),
    });
    peopleData = await res.json();
    try { graph = await api("/api/graph"); initSim(); } catch {}
    renderPeople();
  } catch { /* servidor no disponible */ }
}

function personCard(p) {
  const role = p.role ? ` <span class="who">— ${esc(p.role)}</span>` : "";
  return `<div class="area-card">
    <div class="area-head">
      <span class="area-rank">#${p.rank}${p.pinned ? " 📌" : ""}</span>
      <h3>${esc(p.name)}${role}</h3>
      <div class="area-actions">
        <button title="${p.pinned ? "Soltar pin" : "Fijar como persona clave"}"
          onclick="pinPerson('${esc(p.name)}', ${p.pinned ? "false" : "true"})">${p.pinned ? "✕" : "📌"}</button>
      </div>
    </div>
    <div class="area-stats"><span>score <b>${p.score}</b></span><span>${esc(p.signals_label || "")}</span></div>
  </div>`;
}

async function renderPeople() {
  panelBody.innerHTML = `<h2>Personas clave</h2><div class="empty">Calculando relevancia…</div>`;
  let data;
  try { data = await loadPeople(); } catch (err) {
    panelBody.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; return;
  }
  if (!data.people.length) {
    panelBody.innerHTML = `<h2>Personas clave</h2>
      <div class="empty">Aún no hay personas en el grafo. Sube documentos, sincroniza
      tus fuentes o corre <code>sb ingest brain/</code>.</div>`;
    return;
  }
  let html = `<h2>Personas clave</h2>`;
  if (data.suggested.length) {
    html += `<div class="empty" style="padding:.2rem 0 .7rem">Sugerencia: fija a
      ${data.suggested.map(n => `<a class="src" href="#" onclick="pinPerson('${esc(n)}', true);return false">${esc(n)}</a>`).join(", ")}
      — aparecen en tu agenda, correo y grafo con más señales.</div>`;
  }
  html += data.people.slice(0, 40).map(personCard).join("");
  if ((data.unknown_senders || []).length) {
    html += `<div class="node-type" style="margin-top:1rem">remitentes frecuentes fuera del grafo</div>
      <div class="empty" style="padding:.3rem 0">${data.unknown_senders.map(u =>
        `${esc(u.name)} (${u.mails})`).join(" · ")}<br><small>Solo nombres del último triaje;
      ningún contenido de correo entra a la memoria.</small></div>`;
  }
  panelBody.innerHTML = html;
}

/* ── fuentes: subir + carpetas conectadas + asesor ───────────────────── */
async function loadSources() {
  if (demoMode) {
    if (!sourcesData) sourcesData = { sources: DEMO.sources.map(s => ({ ...s })), ignored: [] };
    return sourcesData;
  }
  sourcesData = await api("/api/sources");
  return sourcesData;
}

async function suggestSources() {
  const box = document.getElementById("suggestions");
  box.innerHTML = `<div class="empty">Revisando tu escritorio y carpetas estándar (solo nombres y fechas; no abre archivos)…</div>`;
  try {
    if (demoMode) {
      suggestionsData = suggestionsData || DEMO.suggestions.map(s => ({ ...s }));
    } else {
      suggestionsData = (await api("/api/sources/suggest")).suggestions;
    }
    renderSuggestions();
  } catch (err) {
    box.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

async function applySource(path, accept) {
  if (demoMode) {
    const i = suggestionsData.findIndex(s => s.path === path);
    if (i >= 0) {
      const s = suggestionsData.splice(i, 1)[0];
      if (accept) sourcesData.sources.push({ path: s.path, alias: s.name, last_sync: null, available: true });
    }
    renderSources(true);
    return;
  }
  try {
    const res = await fetch("/api/sources/apply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, accept }),
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    sourcesData = { sources: data.sources, ignored: data.ignored };
    suggestionsData = (suggestionsData || []).filter(s => s.path !== path);
    renderSources(true);
  } catch { /* servidor no disponible */ }
}

function renderSuggestions() {
  const box = document.getElementById("suggestions");
  if (!box) return;
  if (!suggestionsData) {
    box.innerHTML = `<button class="doc-back" onclick="suggestSources()">Buscar carpetas para conectar</button>`;
    return;
  }
  if (!suggestionsData.length) {
    box.innerHTML = `<div class="empty">Nada nuevo que sugerir: todo está conectado o ignorado.</div>`;
    return;
  }
  box.innerHTML = suggestionsData.map(s => `
    <div class="area-card">
      <div class="area-head">
        <span class="verdict ${esc(s.verdict)}">${esc(s.verdict)}</span>
        <h3>${esc(s.name)}${s.area_guess ? ` <span class="who">→ ${esc(s.area_guess)}</span>` : ""}</h3>
        <div class="area-actions">
          <button title="Conectar (solo lectura)" onclick="applySource('${esc(s.path)}', true)">Conectar</button>
          <button title="Ignorar" onclick="applySource('${esc(s.path)}', false)">Ignorar</button>
        </div>
      </div>
      <div class="area-stats"><span><b>${s.files}</b> archivos</span><span><b>${s.recent}</b> recientes</span></div>
      <div class="who">${(s.reasons || []).map(esc).join("; ")}</div>
    </div>`).join("");
}

async function renderSources(keepSuggestions) {
  panelBody.innerHTML = `<h2>Fuentes</h2><div class="empty">Cargando…</div>`;
  let data;
  try { data = await loadSources(); } catch (err) {
    panelBody.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; return;
  }
  const list = data.sources.length ? data.sources.map(s => `
    <div class="rel-line"><span class="rt">${s.available === false ? "no disponible" : "carpeta"}</span>
      <span>${esc(s.alias)}</span>
      <span class="window">${s.last_sync ? "sync " + esc(s.last_sync.slice(0, 10)) : "sin sincronizar"}</span></div>`).join("")
    : `<div class="empty">Sin carpetas conectadas. Usa el asesor de abajo o <code>sb desktop</code>.</div>`;
  panelBody.innerHTML = `<h2>Fuentes</h2>
    <div class="node-type">subir un documento</div>
    <div id="dropzone" class="dropzone" style="margin:.4rem 0 .5rem">Arrastra un archivo aquí<br>
      <small>o haz clic para elegir — pdf, docx, xlsx, pptx, md, txt, csv, vtt</small></div>
    <input id="file-input" type="file" hidden>
    <div id="upload-result" class="empty" style="padding:.2rem 0 .9rem">Se guarda y procesa solo en tu máquina
      (<code>.brain/uploads/</code>); se clasifica por área automáticamente.</div>
    <div class="node-type">carpetas conectadas (solo lectura)</div>
    ${list}
    <div class="node-type" style="margin-top:1rem">asesor: qué conectar</div>
    <div id="suggestions" style="margin-top:.4rem"></div>
    <div class="sync-line" style="margin-top:.8rem">Sincroniza lo nuevo: <code>sb sources sync --no-llm</code></div>`;
  bindDropzone();
  if (!keepSuggestions) suggestionsData = null;
  renderSuggestions();
}

function selectNode(n) {
  selected = n;
  document.getElementById("panel").classList.add("open");
  renderNode(n);
}

async function renderWhy(n) {
  panelBody.innerHTML = `<div class="node-type">decisión</div>
    <h2>${esc(n.name)}</h2><div class="empty">Reconstruyendo la cadena…</div>`;
  if (demoMode) {
    panelBody.innerHTML = `<div class="node-type">decisión</div>
      <h2>${esc(n.name)}</h2>
      <div id="ask-result">Modo demo — en tu instancia local, este panel
muestra el dossier completo: evidencia de origen, cadena de decisiones
previas y posteriores, compromisos derivados y lo que quedó abierto.
Pruébalo con: sb why "${esc(n.name)}"</div>
      <button class="doc-back" style="margin-top:.7rem" onclick="viewDoc('demo-minuta')">Ver documento de origen (ejemplo) →</button>`;
    return;
  }
  try {
    const res = await api("/api/why?q=" + encodeURIComponent(n.name));
    const srcDoc = res.decision && res.decision.source_doc;
    panelBody.innerHTML = `<div class="node-type">decisión</div>
      <div id="ask-result">${esc(res.markdown)}</div>
      ${srcDoc ? `<button class="doc-back" style="margin-top:.7rem" onclick="viewDoc('${esc(srcDoc)}')">Ver documento de origen →</button>` : ""}`;
  } catch (err) {
    panelBody.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  }
}

function renderNode(n) {
  if (n.type === "decision") return renderWhy(n);
  const rels = links.filter(l => l.a.id === n.id || l.b.id === n.id);
  const relHtml = rels.map(l => {
    const other = l.a.id === n.id ? l.b : l.a;
    const win = `${l.valid_from || "?"} → ${l.valid_to || "vigente"}`;
    return `<div class="rel-line"><span class="rt">${esc(l.type)}</span><span>${esc(other.name)}</span><span class="window">${esc(win)}</span></div>`;
  }).join("");
  const related = kos.filter(k => (k.people || []).includes(n.name) ||
    k.project === n.name || (k.statement || "").includes(n.name));
  panelBody.innerHTML = `
    <div class="node-type">${esc(n.type)}</div>
    <h2>${esc(n.name)}</h2>
    ${relHtml || '<div class="empty">Sin relaciones registradas.</div>'}
    ${related.length ? "<h2 style='margin-top:1.1rem'>Memoria asociada</h2>" + related.map(koCard).join("") : ""}`;
}

/* ── preguntar / buscar ───────────────────────────────────────────────── */
async function onAsk(e) {
  e.preventDefault();
  const q = document.getElementById("ask-input").value.trim();
  if (!q) return;
  const out = document.getElementById("ask-result");
  out.classList.remove("empty");
  out.textContent = "Construyendo context pack…";
  if (demoMode) {
    out.textContent = "Modo demo: conecta el backend (sb serve) para consultar tu memoria real.";
    return;
  }
  try {
    const res = await api("/api/context?q=" + encodeURIComponent(q));
    out.textContent = res.markdown;
  } catch (err) {
    out.textContent = "Error consultando la memoria: " + err.message;
  }
}

let searchTimer = null;
document.getElementById("search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim().toLowerCase();
  searchTimer = setTimeout(() => {
    if (!q) { hovered = null; return; }
    hovered = nodes.find(n => n.name.toLowerCase().includes(q)) || null;
    if (hovered) selectNode(hovered);
  }, 250);
});

loadData();
</script>
